<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Air Draw Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

#video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

.frontCam{
  transform:scaleX(-1);
}

#canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

.ui{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;

  display:flex;
  flex-wrap:wrap;
  gap:10px;

  padding:12px;

  background:rgba(0,0,0,0.55);
  border-radius:18px;
  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.08);
}

.control{
  display:flex;
  flex-direction:column;
  gap:5px;

  color:white;
  font-size:12px;
}

button{
  border:none;
  padding:10px 14px;
  border-radius:12px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#222;
}

input[type="range"]{
  width:120px;
}

.status{
  position:fixed;
  bottom:15px;
  left:15px;
  z-index:10;

  background:rgba(0,0,0,0.55);
  color:white;

  padding:12px 16px;
  border-radius:16px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,0.08);

  line-height:1.5;
}

.hideUI .ui,
.hideUI .status{
  display:none;
}

</style>
</head>
<body>

<video id="video" autoplay playsinline class="frontCam"></video>
<canvas id="canvas"></canvas>

<div class="ui">

  <div class="control">
    <label>Brush Color</label>
    <input type="color" id="colorPicker" value="#00ffff">
  </div>

  <div class="control">
    <label>Brush Size</label>
    <input type="range" id="brushSize" min="2" max="60" value="10">
  </div>

  <div class="control">
    <label>Glow Effect</label>
    <button id="glowBtn">Glow ON</button>
  </div>

  <div class="control">
    <label>Camera</label>
    <button id="cameraBtn">Switch Camera</button>
  </div>

  <div class="control">
    <label>Fullscreen</label>
    <button id="fullscreenBtn">Fullscreen</button>
  </div>

  <div class="control">
    <label>Canvas</label>
    <button id="clearBtn">Clear</button>
  </div>

</div>

<div class="status">
  ✍️ Pinch thumb + index = Draw<br>
  🖐️ Open palm = Erase with palm
  <div id="modeText" style="margin-top:8px;">
    MODE: WAITING
  </div>
</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const modeText = document.getElementById("modeText");

const colorPicker = document.getElementById("colorPicker");
const brushSizeSlider = document.getElementById("brushSize");

const glowBtn = document.getElementById("glowBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const cameraBtn = document.getElementById("cameraBtn");
const clearBtn = document.getElementById("clearBtn");

let glowEnabled = true;

let brushColor = colorPicker.value;
let brushSize = parseInt(brushSizeSlider.value);

let previousX = null;
let previousY = null;

let facingMode = "user";

let stream = null;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

colorPicker.addEventListener("input",(e)=>{
  brushColor = e.target.value;
});

brushSizeSlider.addEventListener("input",(e)=>{
  brushSize = parseInt(e.target.value);
});

glowBtn.addEventListener("click",()=>{

  glowEnabled = !glowEnabled;

  glowBtn.innerText = glowEnabled
    ? "Glow ON"
    : "Glow OFF";
});

clearBtn.addEventListener("click",()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

fullscreenBtn.addEventListener("click", async ()=>{

  if(!document.fullscreenElement){

    await document.documentElement.requestFullscreen();

    document.body.classList.add("hideUI");

  } else {

    await document.exitFullscreen();

    document.body.classList.remove("hideUI");
  }
});

document.addEventListener("fullscreenchange",()=>{

  if(!document.fullscreenElement){
    document.body.classList.remove("hideUI");
  }
});

cameraBtn.addEventListener("click", async ()=>{

  facingMode =
    facingMode === "user"
    ? "environment"
    : "user";

  await startCamera();
});

async function startCamera(){

  if(stream){

    stream.getTracks().forEach(track=>{
      track.stop();
    });
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:facingMode,
      width:{ideal:1280},
      height:{ideal:720}
    },
    audio:false
  });

  video.srcObject = stream;

  if(facingMode === "user"){
    video.classList.add("frontCam");
  } else {
    video.classList.remove("frontCam");
  }
}

function drawLine(x1,y1,x2,y2,color,size){

  ctx.save();

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if(glowEnabled){

    for(let i=4;i>=1;i--){

      ctx.beginPath();

      ctx.strokeStyle = color;

      ctx.lineWidth = size + i*5;

      ctx.globalAlpha = 0.05*i;

      ctx.shadowBlur = 25;
      ctx.shadowColor = color;

      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);

      ctx.stroke();
    }
  }

  ctx.beginPath();

  ctx.strokeStyle = color;

  ctx.lineWidth = size;

  ctx.globalAlpha = 1;

  if(glowEnabled){
    ctx.shadowBlur = 18;
    ctx.shadowColor = color;
  }

  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);

  ctx.stroke();

  ctx.restore();
}

function eraseAt(x,y,size){

  ctx.save();

  ctx.globalCompositeOperation = "destination-out";

  ctx.beginPath();

  ctx.arc(x,y,size,0,Math.PI*2);

  ctx.fill();

  ctx.restore();
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function isFingerUp(tip,pip){
  return tip.y < pip.y;
}

function getGesture(landmarks){

  const thumbTip = landmarks[4];

  const indexTip = landmarks[8];
  const middleTip = landmarks[12];
  const ringTip = landmarks[16];
  const pinkyTip = landmarks[20];

  const indexPip = landmarks[6];
  const middlePip = landmarks[10];
  const ringPip = landmarks[14];
  const pinkyPip = landmarks[18];

  const fingers = [
    isFingerUp(indexTip,indexPip),
    isFingerUp(middleTip,middlePip),
    isFingerUp(ringTip,ringPip),
    isFingerUp(pinkyTip,pinkyPip)
  ];

  const upCount = fingers.filter(Boolean).length;

  const pinchDistance = distance(
    thumbTip,
    indexTip
  );

  // OPEN PALM = erase
  if(upCount >= 4){
    return "erase";
  }

  // PINCH = draw
  if(pinchDistance < 0.05){
    return "draw";
  }

  return "idle";
}

function onResults(results){

  if(
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ){

    previousX = null;
    previousY = null;

    modeText.innerText = "MODE: NO HAND";

    return;
  }

  const landmarks = results.multiHandLandmarks[0];

  const gesture = getGesture(landmarks);

  const indexTip = landmarks[8];

  // PALM CENTER
  const palm = landmarks[9];

  const drawX = (1-indexTip.x)*canvas.width;
  const drawY = indexTip.y*canvas.height;

  const palmX = (1-palm.x)*canvas.width;
  const palmY = palm.y*canvas.height;

  if(gesture === "draw"){

    modeText.innerText = "MODE: DRAWING";

    if(previousX !== null){

      drawLine(
        previousX,
        previousY,
        drawX,
        drawY,
        brushColor,
        brushSize
      );
    }

    previousX = drawX;
    previousY = drawY;
  }

  else if(gesture === "erase"){

    modeText.innerText = "MODE: ERASING";

    eraseAt(
      palmX,
      palmY,
      brushSize * 3
    );

    previousX = null;
    previousY = null;
  }

  else {

    modeText.innerText = "MODE: IDLE";

    previousX = null;
    previousY = null;
  }
}

const hands = new Hands({
  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.6
});

hands.onResults(onResults);

async function initialize(){

  await startCamera();

  const mediaCamera = new Camera(video,{
    onFrame: async ()=>{
      await hands.send({
        image:video
      });
    },
    width:1280,
    height:720
  });

  mediaCamera.start();
}

initialize();

</script>

</body>
</html>
