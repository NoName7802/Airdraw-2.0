<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirDraw Neon ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #0ff;
            font-family: 'Press Start 2P', system-ui;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-bottom: 2px solid #0ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            box-shadow: 0 0 20px #0ff;
        }
        
        h1 {
            margin: 0;
            font-size: 18px;
            text-shadow: 0 0 10px #0ff;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        label {
            font-size: 12px;
        }
        
        input[type="color"] {
            width: 50px;
            height: 30px;
            background: none;
            border: 2px solid #0ff;
            cursor: pointer;
        }
        
        input[type="range"] {
            accent-color: #0ff;
        }
        
        .status {
            font-size: 12px;
            padding: 5px 12px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            border-radius: 4px;
        }
        
        .container {
            position: relative;
            flex: 1;
            overflow: hidden;
        }
        
        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25;
            transform: scaleX(-1);
            z-index: 1;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: #000;
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 25px;
            border: 2px solid #0ff;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            max-width: 90%;
        }
        
        .gesture {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 20;
            border: 1px solid #0ff;
        }
        
        button {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 8px 16px;
            font-family: 'Press Start 2P', system-ui;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 15px #0ff;
        }
    </style>
</head>
<body>
    <header>
        <h1>AIRDRAW NEON ✨</h1>
        <div class="controls">
            <div class="control-group">
                <label>COLOR</label>
                <input type="color" id="colorPicker" value="#00ffff">
            </div>
            <div class="control-group">
                <label>THICKNESS</label>
                <input type="range" id="thickness" min="3" max="40" value="12" step="1">
                <span id="thickVal" style="width:30px; display:inline-block;">12</span>
            </div>
            <button id="clearBtn">CLEAR CANVAS</button>
            <div class="status" id="status">LOADING MEDIA PIPE...</div>
        </div>
    </header>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        
        <div class="gesture" id="gestureDisplay">GESTURE: WAITING</div>
        
        <div class="instructions">
            <strong>GESTURES:</strong> &nbsp; 
            <span style="color:#0f0">☝️ ONE FINGER = DRAW</span> &nbsp; 
            <span style="color:#ff0">🖐 OPEN PALM = ERASE</span> &nbsp; 
            <span style="color:#f66">✊ FIST = PAUSE</span>
        </div>
    </div>

    <script>
        // DOM Elements
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        
        const colorPicker = document.getElementById('colorPicker');
        const thicknessSlider = document.getElementById('thickness');
        const thickVal = document.getElementById('thickVal');
        const clearBtn = document.getElementById('clearBtn');
        const statusEl = document.getElementById('status');
        const gestureDisplay = document.getElementById('gestureDisplay');

        let handLandmarker = null;
        let drawing = false;
        let erasing = false;
        let paused = false;
        let lastX = null;
        let lastY = null;
        let currentColor = '#00ffff';
        let brushSize = 12;
        
        // Drawing trail points for smoother neon effect
        let trailPoints = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 70; // header offset
        }

        // Simple gesture detection from landmarks
        function detectGesture(landmarks) {
            if (!landmarks || landmarks.length === 0) return 'none';
            
            const lm = landmarks[0]; // first hand
            
            // Get key points
            const thumbTip = lm[4];
            const indexTip = lm[8];
            const middleTip = lm[12];
            const ringTip = lm[16];
            const pinkyTip = lm[20];
            
            const thumbIP = lm[3];
            const indexMCP = lm[5];
            const wrist = lm[0];
            
            // Finger extended check (y position relative)
            const isIndexExtended = indexTip.y < indexMCP.y - 0.1;
            const isMiddleExtended = middleTip.y < lm[9].y - 0.1;
            const isRingExtended = ringTip.y < lm[13].y - 0.1;
            const isPinkyExtended = pinkyTip.y < lm[17].y - 0.1;
            
            // Count extended fingers
            let extendedCount = 0;
            if (isIndexExtended) extendedCount++;
            if (isMiddleExtended) extendedCount++;
            if (isRingExtended) extendedCount++;
            if (isPinkyExtended) extendedCount++;
            
            // Thumb check (horizontal distance)
            const thumbExtended = Math.abs(thumbTip.x - indexTip.x) > 0.1;
            
            // Closed fist
            if (extendedCount <= 1 && !thumbExtended) {
                return 'fist';
            }
            
            // Open palm
            if (extendedCount >= 4) {
                return 'open_palm';
            }
            
            // One finger (index pointing)
            if (extendedCount === 1 && isIndexExtended) {
                return 'index';
            }
            
            return 'other';
        }

        function drawNeonLine(x1, y1, x2, y2, color, size) {
            ctx.save();
            
            // Multiple layers for glow
            for (let i = 4; i >= 0; i--) {
                ctx.strokeStyle = color;
                ctx.lineWidth = size + (i * 8);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowColor = color;
                ctx.shadowBlur = 25 + (i * 12);
                
                ctx.globalAlpha = 0.15 + (i * 0.08);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            
            // Core bright line
            ctx.shadowBlur = 15;
            ctx.globalAlpha = 1;
            ctx.lineWidth = size * 0.6;
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            
            ctx.restore();
        }

        function addToTrail(x, y) {
            trailPoints.push({x, y, life: 35, color: currentColor, size: brushSize});
            if (trailPoints.length > 120) trailPoints.shift();
        }

        function updateTrail() {
            ctx.save();
            for (let i = trailPoints.length - 1; i >= 0; i--) {
                const p = trailPoints[i];
                p.life--;
                
                if (p.life <= 0) {
                    trailPoints.splice(i, 1);
                    continue;
                }
                
                const alpha = p.life / 35;
                ctx.globalAlpha = alpha * 0.6;
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 20;
                
                const s = (p.size * p.life / 35) * 0.6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        async function initializeMediaPipe() {
            statusEl.textContent = 'INITIALIZING HAND TRACKER...';
            
            try {
                const vision = await vision_bundle.FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
                );
                
                handLandmarker = await vision_bundle.HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 2,
                    minHandDetectionConfidence: 0.7,
                    minHandPresenceConfidence: 0.7
                });
                
                statusEl.textContent = 'READY - SHOW YOUR HAND';
                console.log('✅ MediaPipe HandLandmarker loaded');
                
            } catch (e) {
                console.error(e);
                statusEl.textContent = '❌ FAILED TO LOAD MODEL';
            }
        }

        async function processFrame() {
            if (!handLandmarker || !video.videoWidth) {
                requestAnimationFrame(processFrame);
                return;
            }
            
            const nowInMs = Date.now();
            const results = handLandmarker.detectForVideo(video, nowInMs);
            
            // Clear previous frame overlays but keep drawing
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update trail
            updateTrail();
            
            let currentGesture = 'none';
            
            if (results.landmarks && results.landmarks.length > 0) {
                // Process first hand
                const landmarks = results.landmarks[0];
                currentGesture = detectGesture(results.landmarks);
                
                // Get index finger tip
                const indexTip = landmarks[8];
                const x = indexTip.x * canvas.width;
                const y = indexTip.y * canvas.height;
                
                gestureDisplay.textContent = `GESTURE: ${currentGesture.toUpperCase()}`;
                
                if (currentGesture === 'fist') {
                    paused = true;
                    lastX = null;
                    lastY = null;
                } else if (currentGesture === 'open_palm') {
                    paused = false;
                    erasing = true;
                    drawing = false;
                    
                    // Erase around palm center
                    const palmCenterX = (landmarks[0].x + landmarks[9].x) * canvas.width / 2;
                    const palmCenterY = (landmarks[0].y + landmarks[9].y) * canvas.height / 2;
                    
                    ctx.save();
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.arc(palmCenterX, palmCenterY, 60, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                    
                } else if (currentGesture === 'index') {
                    paused = false;
                    erasing = false;
                    drawing = true;
                    
                    if (lastX !== null && lastY !== null) {
                        drawNeonLine(lastX, lastY, x, y, currentColor, brushSize);
                        addToTrail(x, y);
                    }
                    
                    lastX = x;
                    lastY = y;
                } else {
                    drawing = false;
                    erasing = false;
                    lastX = null;
                    lastY = null;
                }
                
                // Optional: draw landmarks
                // ctx.fillStyle = 'rgba(0, 255, 100, 0.6)';
                // landmarks.forEach((lm, i) => {
                //     const lx = lm.x * canvas.width;
                //     const ly = lm.y * canvas.height;
                //     ctx.fillRect(lx-3, ly-3, 6, 6);
                // });
            } else {
                gestureDisplay.textContent = 'GESTURE: NO HAND';
                drawing = false;
                erasing = false;
                lastX = null;
                lastY = null;
            }
            
            requestAnimationFrame(processFrame);
        }

        // Event Listeners
        function setupControls() {
            colorPicker.addEventListener('input', (e) => {
                currentColor = e.target.value;
            });
            
            thicknessSlider.addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value);
                thickVal.textContent = brushSize;
            });
            
            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                trailPoints = [];
            });
            
            window.addEventListener('resize', resizeCanvas);
        }

        // Start webcam
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: "user"
                    }
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    resizeCanvas();
                    processFrame();
                };
            } catch (err) {
                console.error("Camera error:", err);
                statusEl.textContent = '❌ CAMERA ACCESS DENIED';
            }
        }

        // Initialize everything
        async function init() {
            resizeCanvas();
            setupControls();
            await initializeMediaPipe();
            await startCamera();
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'c' || e.key === 'C') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                trailPoints = [];
            }
            if (e.key === 'p' || e.key === 'P') {
                paused = !paused;
            }
        });

        // Boot app
        window.onload = init;
    </script>
</body>
</html>
