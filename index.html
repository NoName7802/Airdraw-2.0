<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Air Draw</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
      background: #050505;
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #111 0%, #050505 70%);
      cursor: crosshair;
    }

    video {
      position: fixed;
      right: 15px;
      bottom: 15px;
      width: 220px;
      border-radius: 12px;
      border: 2px solid #00ffff55;
      opacity: 0.85;
      transform: scaleX(-1);
      z-index: 10;
    }

    .ui {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 20;
      display: flex;
      gap: 15px;
      align-items: center;
      background: rgba(0,0,0,0.5);
      padding: 12px 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid #00ffff33;
      box-shadow: 0 0 20px #00ffff22;
    }

    .group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      opacity: 0.8;
    }

    input[type="color"] {
      width: 50px;
      height: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"] {
      width: 120px;
    }

    .status {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 20;
      padding: 10px 16px;
      border-radius: 14px;
      background: rgba(0,0,0,0.5);
      border: 1px solid #ffffff22;
      font-weight: bold;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
    }

    .hint {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 20;
      background: rgba(0,0,0,0.45);
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      border: 1px solid #ffffff11;
      backdrop-filter: blur(10px);
      font-size: 14px;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>
<video id="video" autoplay playsinline></video>

<div class="ui">
  <div class="group">
    <label>Neon Color</label>
    <input type="color" id="colorPicker" value="#00ffff">
  </div>

  <div class="group">
    <label>Brush Thickness</label>
    <input type="range" id="brushSize" min="2" max="40" value="10">
  </div>
</div>

<div class="status" id="status">WAITING...</div>

<div class="hint">
  <div><span class="dot" style="background:#00ffcc"></span>One finger = Draw</div>
  <div><span class="dot" style="background:#ff4444"></span>Open palm = Erase</div>
  <div><span class="dot" style="background:#ffaa00"></span>Closed fist = Pause</div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const videoElement = document.getElementById("video");
  const statusEl = document.getElementById("status");

  const colorPicker = document.getElementById("colorPicker");
  const brushSlider = document.getElementById("brushSize");

  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  let prevX = null;
  let prevY = null;

  let currentColor = colorPicker.value;
  let brushSize = parseInt(brushSlider.value);

  colorPicker.addEventListener("input", e => {
    currentColor = e.target.value;
  });

  brushSlider.addEventListener("input", e => {
    brushSize = parseInt(e.target.value);
  });

  function drawGlowLine(x1, y1, x2, y2, color, size) {
    ctx.save();

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // glow layers
    for (let i = 4; i >= 1; i--) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = size + i * 6;
      ctx.globalAlpha = 0.05 * i;
      ctx.shadowBlur = 25;
      ctx.shadowColor = color;
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // core stroke
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 20;
    ctx.shadowColor = color;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.restore();
  }

  function clearCanvasSoft() {
    ctx.fillStyle = "rgba(5,5,5,0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function isFingerUp(tip, pip) {
    return tip.y < pip.y;
  }

  function detectGesture(landmarks) {
    const thumbTip = landmarks[4];
    const indexTip = landmarks[8];
    const middleTip = landmarks[12];
    const ringTip = landmarks[16];
    const pinkyTip = landmarks[20];

    const indexPip = landmarks[6];
    const middlePip = landmarks[10];
    const ringPip = landmarks[14];
    const pinkyPip = landmarks[18];

    const fingers = [
      isFingerUp(indexTip, indexPip),
      isFingerUp(middleTip, middlePip),
      isFingerUp(ringTip, ringPip),
      isFingerUp(pinkyTip, pinkyPip),
    ];

    const upCount = fingers.filter(Boolean).length;

    // Open palm
    if (upCount >= 4) return "erase";

    // Only index up
    if (
      fingers[0] &&
      !fingers[1] &&
      !fingers[2] &&
      !fingers[3]
    ) {
      return "draw";
    }

    // Fist
    if (upCount === 0) return "pause";

    return "pause";
  }

  function onResults(results) {
    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
      prevX = null;
      prevY = null;
      statusEl.innerText = "NO HAND";
      return;
    }

    const landmarks = results.multiHandLandmarks[0];
    const gesture = detectGesture(landmarks);

    const indexTip = landmarks[8];

    const x = (1 - indexTip.x) * canvas.width;
    const y = indexTip.y * canvas.height;

    if (gesture === "draw") {
      statusEl.innerText = "DRAWING";
      statusEl.style.color = currentColor;

      if (prevX !== null && prevY !== null) {
        drawGlowLine(prevX, prevY, x, y, currentColor, brushSize);
      }

      prevX = x;
      prevY = y;

    } else if (gesture === "erase") {
      statusEl.innerText = "ERASING";
      statusEl.style.color = "#ff4444";

      clearCanvasSoft();

      prevX = null;
      prevY = null;

    } else {
      statusEl.innerText = "PAUSED";
      statusEl.style.color = "#ffaa00";

      prevX = null;
      prevY = null;
    }
  }

  const hands = new Hands({
    locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
  });

  hands.onResults(onResults);

  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await hands.send({ image: videoElement });
    },
    width: 1280,
    height: 720
  });

  camera.start();

  // Ambient particles
  function ambientGlow() {
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,0.01)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();

    requestAnimationFrame(ambientGlow);
  }

  ambientGlow();
</script>

</body>
</html>
