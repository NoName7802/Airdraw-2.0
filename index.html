<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Neon AirDraw AI</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
}

#video{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

.front{
  transform:scaleX(-1);
}

#canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

.ui{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;

  z-index:10;

  display:flex;
  flex-wrap:wrap;
  gap:10px;

  padding:12px;

  background:rgba(0,0,0,0.55);

  border-radius:18px;

  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.08);
}

.control{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:white;
  font-size:12px;
}

button{
  border:none;
  background:#111;
  color:white;

  padding:10px 14px;

  border-radius:12px;

  font-weight:bold;

  cursor:pointer;
}

button:hover{
  background:#222;
}

input[type="range"]{
  width:120px;
}

.status{
  position:fixed;
  bottom:15px;
  left:15px;

  z-index:10;

  background:rgba(0,0,0,0.55);

  color:white;

  padding:12px 16px;

  border-radius:16px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,0.08);

  line-height:1.5;
}

.hideUI .ui,
.hideUI .status{
  display:none;
}

</style>
</head>
<body>

<video id="video" autoplay playsinline class="front"></video>
<canvas id="canvas"></canvas>

<div class="ui">

  <div class="control">
    <label>Brush Color</label>
    <input type="color" id="colorPicker" value="#00ffff">
  </div>

  <div class="control">
    <label>Brush Size</label>
    <input type="range" id="brushSize" min="2" max="60" value="10">
  </div>

  <div class="control">
    <label>Glow</label>
    <button id="glowBtn">Glow ON</button>
  </div>

  <div class="control">
    <label>Shape AI</label>
    <button id="shapeBtn">Shape AI ON</button>
  </div>

  <div class="control">
    <label>Camera</label>
    <button id="cameraBtn">Switch Camera</button>
  </div>

  <div class="control">
    <label>Fullscreen</label>
    <button id="fullscreenBtn">Fullscreen</button>
  </div>

  <div class="control">
    <label>Canvas</label>
    <button id="clearBtn">Clear</button>
  </div>

</div>

<div class="status">
  ✍️ Pinch = Draw<br>
  🖐️ Palm = Erase<br>
  🤖 AI Shape Assist Enabled
  <div id="modeText" style="margin-top:8px;">
    MODE: WAITING
  </div>
</div>

<script>

//////////////////////////////
// PWA SUPPORT
//////////////////////////////

const manifest = {
  name:"Neon AirDraw AI",
  short_name:"AirDraw",
  start_url:".",
  display:"standalone",
  background_color:"#000000",
  theme_color:"#000000",
  icons:[]
};

const manifestBlob = new Blob(
  [JSON.stringify(manifest)],
  {type:'application/json'}
);

const manifestURL = URL.createObjectURL(manifestBlob);

const link = document.createElement("link");
link.rel = "manifest";
link.href = manifestURL;

document.head.appendChild(link);

if('serviceWorker' in navigator){

  const swCode = `
  self.addEventListener('fetch',()=>{});
  `;

  const swBlob = new Blob(
    [swCode],
    {type:'text/javascript'}
  );

  navigator.serviceWorker.register(
    URL.createObjectURL(swBlob)
  );
}

//////////////////////////////
// ELEMENTS
//////////////////////////////

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const colorPicker = document.getElementById("colorPicker");
const brushSlider = document.getElementById("brushSize");

const glowBtn = document.getElementById("glowBtn");
const shapeBtn = document.getElementById("shapeBtn");
const cameraBtn = document.getElementById("cameraBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const clearBtn = document.getElementById("clearBtn");

const modeText = document.getElementById("modeText");

//////////////////////////////
// SETTINGS
//////////////////////////////

let glowEnabled = true;
let shapeAI = true;

let brushColor = colorPicker.value;
let brushSize = parseInt(brushSlider.value);

let facingMode = "user";

let prevX = null;
let prevY = null;

let smoothX = null;
let smoothY = null;

let currentStroke = [];

//////////////////////////////
// CANVAS
//////////////////////////////

function resizeCanvas(){

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

//////////////////////////////
// UI EVENTS
//////////////////////////////

colorPicker.addEventListener("input",(e)=>{
  brushColor = e.target.value;
});

brushSlider.addEventListener("input",(e)=>{
  brushSize = parseInt(e.target.value);
});

glowBtn.addEventListener("click",()=>{

  glowEnabled = !glowEnabled;

  glowBtn.innerText =
    glowEnabled
    ? "Glow ON"
    : "Glow OFF";
});

shapeBtn.addEventListener("click",()=>{

  shapeAI = !shapeAI;

  shapeBtn.innerText =
    shapeAI
    ? "Shape AI ON"
    : "Shape AI OFF";
});

clearBtn.addEventListener("click",()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

fullscreenBtn.addEventListener("click", async ()=>{

  if(!document.fullscreenElement){

    await document.documentElement.requestFullscreen();

    document.body.classList.add("hideUI");

  } else {

    await document.exitFullscreen();

    document.body.classList.remove("hideUI");
  }
});

cameraBtn.addEventListener("click", async ()=>{

  facingMode =
    facingMode === "user"
    ? "environment"
    : "user";

  await startCamera();
});

//////////////////////////////
// CAMERA
//////////////////////////////

let stream = null;

async function startCamera(){

  if(stream){

    stream.getTracks().forEach(track=>{
      track.stop();
    });
  }

  stream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:facingMode,
      width:{ideal:1280},
      height:{ideal:720}
    }
  });

  video.srcObject = stream;

  if(facingMode === "user"){
    video.classList.add("front");
  } else {
    video.classList.remove("front");
  }
}

//////////////////////////////
// DRAWING ENGINE
//////////////////////////////

function lerp(a,b,t){
  return a+(b-a)*t;
}

function drawParticle(x,y,color,size){

  ctx.save();

  ctx.beginPath();

  ctx.fillStyle = color;

  ctx.globalAlpha = Math.random()*0.5;

  ctx.shadowBlur = 20;

  ctx.shadowColor = color;

  ctx.arc(
    x + (Math.random()-0.5)*10,
    y + (Math.random()-0.5)*10,
    Math.random()*size/2,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

function drawLine(x1,y1,x2,y2,color,size,speed){

  ctx.save();

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // PRESSURE SIMULATION
  const dynamicSize =
    Math.max(
      2,
      size - speed*0.05
    );

  if(glowEnabled){

    for(let i=4;i>=1;i--){

      ctx.beginPath();

      ctx.strokeStyle = color;

      ctx.lineWidth = dynamicSize + i*5;

      ctx.globalAlpha = 0.04*i;

      ctx.shadowBlur = 25;

      ctx.shadowColor = color;

      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);

      ctx.stroke();
    }
  }

  ctx.beginPath();

  ctx.strokeStyle = color;

  ctx.lineWidth = dynamicSize;

  ctx.globalAlpha = 1;

  if(glowEnabled){

    ctx.shadowBlur = 18;
    ctx.shadowColor = color;
  }

  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);

  ctx.stroke();

  ctx.restore();

  // PARTICLES

  if(glowEnabled){

    for(let i=0;i<3;i++){

      drawParticle(
        x2,
        y2,
        color,
        dynamicSize
      );
    }
  }
}

function eraseAt(x,y,size){

  ctx.save();

  ctx.globalCompositeOperation =
    "destination-out";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    size,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();
}

//////////////////////////////
// SHAPE AI
//////////////////////////////

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function recognizeShape(points){

  if(points.length < 15){
    return null;
  }

  const start = points[0];
  const end = points[points.length-1];

  const closeDist = distance(start,end);

  // CIRCLE DETECTION

  if(closeDist < 50){

    let cx = 0;
    let cy = 0;

    points.forEach(p=>{
      cx += p.x;
      cy += p.y;
    });

    cx /= points.length;
    cy /= points.length;

    let avgRadius = 0;

    points.forEach(p=>{
      avgRadius += Math.hypot(
        p.x-cx,
        p.y-cy
      );
    });

    avgRadius /= points.length;

    return {
      type:"circle",
      x:cx,
      y:cy,
      r:avgRadius
    };
  }

  // LINE DETECTION

  return {
    type:"line",
    x1:start.x,
    y1:start.y,
    x2:end.x,
    y2:end.y
  };
}

function drawRecognizedShape(shape){

  ctx.save();

  ctx.strokeStyle = brushColor;
  ctx.lineWidth = brushSize;

  ctx.shadowBlur = glowEnabled ? 20 : 0;
  ctx.shadowColor = brushColor;

  ctx.beginPath();

  if(shape.type === "circle"){

    ctx.arc(
      shape.x,
      shape.y,
      shape.r,
      0,
      Math.PI*2
    );
  }

  if(shape.type === "line"){

    ctx.moveTo(shape.x1,shape.y1);
    ctx.lineTo(shape.x2,shape.y2);
  }

  ctx.stroke();

  ctx.restore();
}

//////////////////////////////
// GESTURES
//////////////////////////////

function isFingerUp(tip,pip){
  return tip.y < pip.y;
}

function getGesture(landmarks){

  const thumbTip = landmarks[4];

  const indexTip = landmarks[8];

  const middleTip = landmarks[12];
  const ringTip = landmarks[16];
  const pinkyTip = landmarks[20];

  const middlePip = landmarks[10];
  const ringPip = landmarks[14];
  const pinkyPip = landmarks[18];

  const fingersUp = [
    isFingerUp(middleTip,middlePip),
    isFingerUp(ringTip,ringPip),
    isFingerUp(pinkyTip,pinkyPip)
  ];

  const pinchDist = distance(
    thumbTip,
    indexTip
  );

  // OPEN PALM

  if(fingersUp.every(v=>v===true)){

    return "erase";
  }

  // PINCH

  if(pinchDist < 0.05){

    return "draw";
  }

  return "idle";
}

//////////////////////////////
// MEDIAPIPE
//////////////////////////////

function onResults(results){

  if(
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length===0
  ){

    if(shapeAI && currentStroke.length > 10){

      const shape =
        recognizeShape(currentStroke);

      if(shape){

        drawRecognizedShape(shape);
      }
    }

    currentStroke = [];

    prevX = null;
    prevY = null;

    modeText.innerText = "MODE: NO HAND";

    return;
  }

  const landmarks =
    results.multiHandLandmarks[0];

  const gesture =
    getGesture(landmarks);

  const finger = landmarks[8];

  const palm = landmarks[9];

  let x =
    (1-finger.x)*canvas.width;

  let y =
    finger.y*canvas.height;

  let palmX =
    (1-palm.x)*canvas.width;

  let palmY =
    palm.y*canvas.height;

  // SMOOTHING

  if(smoothX === null){

    smoothX = x;
    smoothY = y;
  }

  smoothX = lerp(smoothX,x,0.35);
  smoothY = lerp(smoothY,y,0.35);

  x = smoothX;
  y = smoothY;

  if(gesture === "draw"){

    modeText.innerText =
      "MODE: DRAWING";

    currentStroke.push({x,y});

    if(prevX !== null){

      const speed =
        Math.hypot(
          x-prevX,
          y-prevY
        );

      drawLine(
        prevX,
        prevY,
        x,
        y,
        brushColor,
        brushSize,
        speed
      );
    }

    prevX = x;
    prevY = y;
  }

  else if(gesture === "erase"){

    modeText.innerText =
      "MODE: ERASING";

    eraseAt(
      palmX,
      palmY,
      brushSize*3
    );

    prevX = null;
    prevY = null;
  }

  else {

    modeText.innerText =
      "MODE: IDLE";

    if(shapeAI && currentStroke.length > 10){

      const shape =
        recognizeShape(currentStroke);

      if(shape){

        drawRecognizedShape(shape);
      }
    }

    currentStroke = [];

    prevX = null;
    prevY = null;
  }
}

const hands = new Hands({
  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.6
});

hands.onResults(onResults);

//////////////////////////////
// INIT
//////////////////////////////

async function init(){

  await startCamera();

  const cam = new Camera(video,{
    onFrame: async ()=>{
      await hands.send({
        image:video
      });
    },
    width:1280,
    height:720
  });

  cam.start();
}

init();

</script>

</body>
</html>
