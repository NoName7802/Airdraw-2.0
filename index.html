<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Advanced Air Drawing</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  z-index:1;
}

#drawCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  touch-action:none;
}

.topbar{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;

  display:flex;
  flex-wrap:wrap;
  gap:10px;

  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.1);

  padding:12px;
  border-radius:18px;

  backdrop-filter:blur(10px);
}

.control{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:white;
  font-size:12px;
}

input[type="range"]{
  width:120px;
}

button{
  border:none;
  background:#111;
  color:white;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#222;
}

.status{
  position:fixed;
  bottom:15px;
  left:15px;
  z-index:10;

  background:rgba(0,0,0,0.55);
  color:white;

  padding:12px 16px;
  border-radius:16px;

  border:1px solid rgba(255,255,255,0.1);

  backdrop-filter:blur(10px);
  line-height:1.5;
  font-size:14px;
}

.badge{
  font-weight:bold;
  color:#00ffcc;
}

</style>
</head>
<body>

<video id="camera" autoplay playsinline></video>
<canvas id="drawCanvas"></canvas>

<div class="topbar">

  <div class="control">
    <label>Brush Color</label>
    <input type="color" id="colorPicker" value="#00ffff">
  </div>

  <div class="control">
    <label>Brush Size</label>
    <input type="range" id="brushSize" min="2" max="50" value="10">
  </div>

  <div class="control">
    <label>Glow Effect</label>
    <button id="glowToggle">Glow: ON</button>
  </div>

  <div class="control">
    <label>Fullscreen</label>
    <button id="fullscreenBtn">Enter Fullscreen</button>
  </div>

  <div class="control">
    <label>Clear</label>
    <button id="clearBtn">Clear Canvas</button>
  </div>

</div>

<div class="status">
  <div><span class="badge">✍️ Pinch Gesture</span> = Draw</div>
  <div><span class="badge">🖐️ Open Palm</span> = Erase</div>
  <div><span class="badge">✊ Fist</span> = Pause</div>
  <div id="modeText" style="margin-top:8px;">MODE: WAITING</div>
</div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

const modeText = document.getElementById("modeText");

const colorPicker = document.getElementById("colorPicker");
const brushSlider = document.getElementById("brushSize");

const glowToggle = document.getElementById("glowToggle");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const clearBtn = document.getElementById("clearBtn");

let glowEnabled = true;

let brushColor = colorPicker.value;
let brushSize = parseInt(brushSlider.value);

let prevX = null;
let prevY = null;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

colorPicker.addEventListener("input", e=>{
  brushColor = e.target.value;
});

brushSlider.addEventListener("input", e=>{
  brushSize = parseInt(e.target.value);
});

glowToggle.addEventListener("click", ()=>{
  glowEnabled = !glowEnabled;
  glowToggle.innerText = glowEnabled ? "Glow: ON" : "Glow: OFF";
});

fullscreenBtn.addEventListener("click", ()=>{
  if(document.fullscreenElement){
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
});

clearBtn.addEventListener("click", ()=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
});

function drawLine(x1,y1,x2,y2,color,size){

  ctx.save();

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if(glowEnabled){

    for(let i=4;i>=1;i--){
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = size + i*5;
      ctx.globalAlpha = 0.05*i;
      ctx.shadowBlur = 25;
      ctx.shadowColor = color;
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
  }

  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = size;
  ctx.globalAlpha = 1;

  if(glowEnabled){
    ctx.shadowBlur = 20;
    ctx.shadowColor = color;
  } else {
    ctx.shadowBlur = 0;
  }

  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();

  ctx.restore();
}

function eraseAt(x,y,size){

  ctx.save();

  ctx.globalCompositeOperation = "destination-out";

  ctx.beginPath();
  ctx.arc(x,y,size,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function isFingerUp(tip,pip){
  return tip.y < pip.y;
}

function getGesture(landmarks){

  const thumbTip = landmarks[4];

  const indexTip = landmarks[8];
  const middleTip = landmarks[12];
  const ringTip = landmarks[16];
  const pinkyTip = landmarks[20];

  const indexPip = landmarks[6];
  const middlePip = landmarks[10];
  const ringPip = landmarks[14];
  const pinkyPip = landmarks[18];

  const fingers = [
    isFingerUp(indexTip,indexPip),
    isFingerUp(middleTip,middlePip),
    isFingerUp(ringTip,ringPip),
    isFingerUp(pinkyTip,pinkyPip)
  ];

  const upCount = fingers.filter(Boolean).length;

  // PINCH detection (like holding pen)
  const pinchDist = distance(thumbTip,indexTip);

  // Open palm
  if(upCount >= 4){
    return "erase";
  }

  // Closed fist
  if(upCount === 0){
    return "pause";
  }

  // Draw only when thumb and index are touching
  if(pinchDist < 0.05){
    return "draw";
  }

  return "pause";
}

function onResults(results){

  if(!results.multiHandLandmarks || results.multiHandLandmarks.length===0){

    prevX = null;
    prevY = null;

    modeText.innerText = "MODE: NO HAND";

    return;
  }

  const landmarks = results.multiHandLandmarks[0];

  const gesture = getGesture(landmarks);

  const indexTip = landmarks[8];

  const x = (1-indexTip.x)*canvas.width;
  const y = indexTip.y*canvas.height;

  if(gesture==="draw"){

    modeText.innerText = "MODE: DRAWING ✍️";

    if(prevX!==null && prevY!==null){
      drawLine(prevX,prevY,x,y,brushColor,brushSize);
    }

    prevX = x;
    prevY = y;

  }

  else if(gesture==="erase"){

    modeText.innerText = "MODE: ERASING 🖐️";

    eraseAt(x,y,brushSize*2);

    prevX = null;
    prevY = null;
  }

  else {

    modeText.innerText = "MODE: PAUSED ✊";

    prevX = null;
    prevY = null;
  }
}

const hands = new Hands({
  locateFile:(file)=>{
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.7,
  minTrackingConfidence:0.6
});

hands.onResults(onResults);

const camera = new Camera(video,{
  onFrame: async ()=>{
    await hands.send({image:video});
  },
  width:1280,
  height:720
});

camera.start();

</script>

</body>
</html>
